<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스네이크 아케이드</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101512;
      color: #eef5ef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 280px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(ellipse at top, #1a2a20 0%, #101512 58%);
    }

    .game {
      width: min(100%, 460px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #8ca494;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #f2f7f3;
      font-size: clamp(1.8rem, 8vw, 2.5rem);
      letter-spacing: 0.04em;
    }

    .score-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 10px;
      padding: 12px 16px;
      border: 1px solid #29382e;
      border-radius: 12px;
      background: #18211b;
    }

    .score-label {
      color: #a9b9ae;
      font-size: 0.9rem;
    }

    #score {
      color: #77f28d;
      font-size: 1.4rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .board-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border: 2px solid #35483a;
      border-radius: 14px;
      background: #111a14;
      box-shadow: 0 16px 40px #0006, 0 0 28px #63e87a12;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .message {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 6px;
      padding: 20px;
      background: #0c120ed9;
      color: #f3f8f4;
      font-size: clamp(1.2rem, 5vw, 1.65rem);
      font-weight: 800;
    }

    .message small {
      color: #b4c3b8;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .message[hidden] {
      display: none;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      min-height: 46px;
      border: 1px solid #3b4b40;
      border-radius: 10px;
      background: #202b23;
      color: #f0f5f1;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 120ms ease, transform 120ms ease;
    }

    button:hover {
      background: #2a392e;
    }

    button:active {
      transform: scale(0.97);
    }

    button:focus-visible {
      outline: 3px solid #77f28d;
      outline-offset: 3px;
    }

    .actions button {
      flex: 1;
    }

    #startButton {
      border-color: #63d978;
      background: #2ba847;
      color: #071109;
    }

    #startButton:hover {
      background: #39c456;
    }

    .touch-controls {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(2, 54px);
      justify-content: center;
      gap: 8px;
      margin: 18px auto 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .touch-controls button {
      background: #202b23;
      font-size: 1.35rem;
    }

    .touch-controls .up {
      grid-column: 2;
      grid-row: 1;
    }

    .touch-controls .left {
      grid-column: 1;
      grid-row: 2;
    }

    .touch-controls .down {
      grid-column: 2;
      grid-row: 2;
    }

    .touch-controls .right {
      grid-column: 3;
      grid-row: 2;
    }

    .hint {
      margin: 16px 0 0;
      color: #85968a;
      font-size: 0.8rem;
      line-height: 1.6;
    }

    @media (min-width: 700px) {
      .touch-controls {
        margin-top: 16px;
      }
    }

    @media (max-height: 720px) and (min-width: 500px) {
      body {
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .score-panel {
        margin-top: 12px;
      }

      .touch-controls {
        margin-top: 10px;
      }

      .hint {
        margin-top: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <p class="eyebrow">아케이드 게임</p>
    <h1>스네이크</h1>

    <section class="score-panel" aria-label="게임 점수">
      <span class="score-label">점수</span>
      <span id="score" aria-live="polite">0</span>
    </section>

    <div class="board-frame">
      <canvas id="board" width="400" height="400" aria-label="20 곱하기 20 스네이크 게임판"></canvas>
      <div id="message" class="message">
        스네이크
        <small>시작 버튼을 눌러 플레이하세요</small>
      </div>
    </div>

    <div class="actions">
      <button id="startButton" type="button">시작</button>
      <button id="pauseButton" type="button">일시정지</button>
      <button id="restartButton" type="button">다시 시작</button>
    </div>

    <nav class="touch-controls" aria-label="터치 방향 조작">
      <button class="up" type="button" aria-label="위로" data-direction="up">▲</button>
      <button class="left" type="button" aria-label="왼쪽으로" data-direction="left">◀</button>
      <button class="down" type="button" aria-label="아래로" data-direction="down">▼</button>
      <button class="right" type="button" aria-label="오른쪽으로" data-direction="right">▶</button>
    </nav>

    <p class="hint">PC: 방향키 또는 WASD · 모바일/태블릿: 화면의 방향 버튼</p>
  </main>

  <script>
    (() => {
      const SIZE = 20;
      const CELL = 20;
      const TICK_MS = 130;

      const canvas = document.querySelector("#board");
      const ctx = canvas.getContext("2d");
      const scoreElement = document.querySelector("#score");
      const messageElement = document.querySelector("#message");
      const startButton = document.querySelector("#startButton");
      const pauseButton = document.querySelector("#pauseButton");
      const restartButton = document.querySelector("#restartButton");

      const directions = {
        up:    { x: 0, y: -1 },
        down:  { x: 0, y: 1 },
        left:  { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      let snake;
      let direction;
      let nextDirection;
      let turnQueued;
      let food;
      let score;
      let state = "ready";
      let timer = null;

      function resetGame() {
        snake = [
          { x: 9, y: 10 },
          { x: 8, y: 10 },
          { x: 7, y: 10 }
        ];
        direction = { ...directions.right };
        nextDirection = { ...direction };
        turnQueued = false;
        score = 0;
        food = createFood();
        scoreElement.textContent = score;
        state = "ready";
        clearInterval(timer);
        timer = null;
        showMessage("스네이크", "시작 버튼을 눌러 플레이하세요");
        draw();
      }

      function createFood() {
        const emptyCells = [];

        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            if (!snake.some(segment => segment.x === x && segment.y === y)) {
              emptyCells.push({ x, y });
            }
          }
        }

        if (emptyCells.length === 0) return null;
        return emptyCells[Math.floor(Math.random() * emptyCells.length)];
      }

      function showMessage(title, subtitle) {
        messageElement.replaceChildren();

        const titleNode = document.createElement("span");
        titleNode.textContent = title;
        messageElement.append(titleNode);

        if (subtitle) {
          const subtitleNode = document.createElement("small");
          subtitleNode.textContent = subtitle;
          messageElement.append(subtitleNode);
        }

        messageElement.hidden = false;
      }

      function hideMessage() {
        messageElement.hidden = true;
      }

      function startGame() {
        if (state === "over") resetGame();
        if (state === "running") return;

        state = "running";
        hideMessage();
        clearInterval(timer);
        timer = setInterval(tick, TICK_MS);
        draw();
      }

      function pauseGame() {
        if (state !== "running") return;

        state = "paused";
        clearInterval(timer);
        timer = null;
        showMessage("일시정지", "시작 버튼을 눌러 계속하세요");
        draw();
      }

      function restartGame() {
        resetGame();
        startGame();
      }

      function requestDirection(candidate) {
        if (state !== "running" || turnQueued) return;

        // 현재 진행 방향의 정반대 방향으로는 즉시 꺾을 수 없습니다.
        if (candidate.x + direction.x === 0 && candidate.y + direction.y === 0) return;

        nextDirection = { ...candidate };
        turnQueued = true;
      }

      function tick() {
        direction = { ...nextDirection };
        turnQueued = false;

        const head = snake[0];
        const nextHead = {
          x: head.x + direction.x,
          y: head.y + direction.y
        };

        const eating = food && nextHead.x === food.x && nextHead.y === food.y;

        if (
          nextHead.x < 0 || nextHead.x >= SIZE ||
          nextHead.y < 0 || nextHead.y >= SIZE
        ) {
          endGame("게임 오버", "벽에 부딪혔어요");
          return;
        }

        // 먹이를 먹지 않는 경우 꼬리는 이번 이동에서 빠지므로 충돌 검사에서 제외합니다.
        const bodyToCheck = eating ? snake : snake.slice(0, -1);
        if (bodyToCheck.some(segment => segment.x === nextHead.x && segment.y === nextHead.y)) {
          endGame("게임 오버", "뱀의 몸에 부딪혔어요");
          return;
        }

        snake.unshift(nextHead);

        if (eating) {
          score += 10;
          scoreElement.textContent = score;
          food = createFood();

          if (!food) {
            endGame("승리!", "게임판을 모두 채웠어요");
            return;
          }
        } else {
          snake.pop();
        }

        draw();
      }

      function endGame(title, subtitle) {
        state = "over";
        clearInterval(timer);
        timer = null;
        showMessage(title, `${subtitle} · 점수 ${score}점`);
        draw();
      }

      function draw() {
        ctx.clearRect(0, 0, 400, 400);
        ctx.fillStyle = "#111a14";
        ctx.fillRect(0, 0, 400, 400);

        // 20×20 격자
        ctx.strokeStyle = "#1d2a20";
        ctx.lineWidth = 1;
        for (let i = 0; i <= SIZE; i++) {
          const position = i * CELL + 0.5;
          ctx.beginPath();
          ctx.moveTo(position, 0);
          ctx.lineTo(position, 400);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(0, position);
          ctx.lineTo(400, position);
          ctx.stroke();
        }

        if (food) {
          const centerX = food.x * CELL + CELL / 2;
          const centerY = food.y * CELL + CELL / 2;
          ctx.fillStyle = "#ff6464";
          ctx.beginPath();
          ctx.arc(centerX, centerY, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ffaaaa";
          ctx.beginPath();
          ctx.arc(centerX - 2, centerY - 2, 2, 0, Math.PI * 2);
          ctx.fill();
        }

        snake.forEach((segment, index) => {
          const inset = index === 0 ? 2 : 3;
          ctx.fillStyle = index === 0 ? "#9aff9e" : "#51d96c";
          roundedRect(
            segment.x * CELL + inset,
            segment.y * CELL + inset,
            CELL - inset * 2,
            CELL - inset * 2,
            5
          );
        });

        if (snake.length > 0) {
          drawEyes(snake[0]);
        }
      }

      function roundedRect(x, y, width, height, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
        ctx.fill();
      }

      function drawEyes(head) {
        const cx = head.x * CELL + CELL / 2;
        const cy = head.y * CELL + CELL / 2;
        const side = direction.x === 0 ? 4 : 0;
        const forward = direction.y === 0 ? 4 : 0;
        const perpendicularX = direction.y === 0 ? 0 : 4;
        const perpendicularY = direction.x === 0 ? 0 : 4;

        ctx.fillStyle = "#12351a";
        for (const sign of [-1, 1]) {
          ctx.beginPath();
          ctx.arc(
            cx + direction.x * side + perpendicularX * sign,
            cy + direction.y * forward + perpendicularY * sign,
            1.5,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const pixelSize = Math.round(rect.width * dpr);

        if (pixelSize > 0 && canvas.width !== pixelSize) {
          canvas.width = pixelSize;
          canvas.height = pixelSize;
          ctx.setTransform(pixelSize / 400, 0, 0, pixelSize / 400, 0, 0);
          draw();
        }
      }

      document.addEventListener("keydown", event => {
        const keyMap = {
          ArrowUp: "up",
          ArrowDown: "down",
          ArrowLeft: "left",
          ArrowRight: "right",
          w: "up",
          W: "up",
          s: "down",
          S: "down",
          a: "left",
          A: "left",
          d: "right",
          D: "right"
        };

        const name = keyMap[event.key];
        if (!name) return;

        event.preventDefault();
        requestDirection(directions[name]);
      });

      document.querySelectorAll("[data-direction]").forEach(button => {
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          requestDirection(directions[button.dataset.direction]);
        });
      });

      startButton.addEventListener("click", startGame);
      pauseButton.addEventListener("click", pauseGame);
      restartButton.addEventListener("click", restartGame);

      if ("ResizeObserver" in window) {
        new ResizeObserver(resizeCanvas).observe(canvas);
      } else {
        window.addEventListener("resize", resizeCanvas);
      }

      resetGame();
      resizeCanvas();
    })();
  </script>
</body>
</html>
